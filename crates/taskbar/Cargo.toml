[package]
name = "atelier-taskbar"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Taskbar morphing engine, DWM composition styles, and Explorer crash recovery for Atelier."

[features]
xaml-probe = []

[dependencies]
atelier-common.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
] }
thiserror.workspace = true
tracing.workspace = true

[build-dependencies]
cc = "1"
