[package]
name = "atelier-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Theme Studio management UI and live desktop preview controls for Atelier."

[lib]
name = "atelier_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Atelier"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
atelier-common.workspace = true
atelier-taskbar.workspace = true
atelier-wallpaper.workspace = true
atelier-audio.workspace = true
atelier-widget.workspace = true
atelier-core = { path = "../core" }
mimalloc.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Storage_FileSystem",
] }
crossbeam-channel.workspace = true
png = "0.18"

base64 = "0.23"
