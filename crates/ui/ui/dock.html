<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier Dock</title>
<style>
:root{color-scheme:dark;--icon:44px;--gap:6px;--padding:10px;--radius:18px;--tint:35,37,50;--alpha:.72;--inactive:.85;--indicator:#f3f0ea;--zoom:1.35;--room:30px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#f3f1ed;font:12px 'Segoe UI Variable','Segoe UI',sans-serif;user-select:none}
body{display:flex;align-items:flex-end;justify-content:center;padding:var(--room) 14px 14px}
body.top{align-items:flex-start;padding:14px 14px var(--room)}
body.left{align-items:center;justify-content:flex-start;padding:14px var(--room) 14px 14px}
body.right{align-items:center;justify-content:flex-end;padding:14px 14px 14px var(--room)}
.dock{display:flex;align-items:center;gap:var(--gap);padding:var(--padding);border:1px solid rgba(255,255,255,.23);border-radius:var(--radius);background:linear-gradient(180deg,rgba(255,255,255,.11),transparent 60%),rgba(var(--tint),var(--alpha));box-shadow:0 5px 14px #0005,inset 0 1px #ffffff12;max-width:100%;max-height:100%;position:relative}
.left .dock,.right .dock{flex-direction:column}
.apps{--zoom-pad:calc(var(--icon)*(var(--zoom) - 1)/2 + 8px);display:flex;gap:var(--gap);align-items:center;min-width:0;min-height:0;overflow:auto;scrollbar-width:none;padding:var(--zoom-pad) 3px;margin:calc(-1*var(--zoom-pad)) -3px}
.left .apps,.right .apps{flex-direction:column;padding:3px var(--zoom-pad);margin:-3px calc(-1*var(--zoom-pad))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app,.studio{flex:0 0 auto;position:relative;border:0;padding:0;background:transparent;width:var(--icon);height:calc(var(--icon) + 7px);display:grid;place-items:center;outline-offset:3px;border-radius:9px}
.app:focus-visible,.studio:focus-visible{outline:2px solid #eee}
.app .icon{width:var(--icon);height:var(--icon);display:grid;place-items:center;border-radius:22%;transform-origin:center;transition:transform .16s ease,opacity .16s,filter .16s,background .16s;pointer-events:none}
.app img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 2px #0004)}
.app:not(.active) .icon{opacity:var(--inactive)}
.app.active .icon{background:var(--active-fill,rgba(255,255,255,.12))}
.rounded .app .icon{background:rgba(255,255,255,.1);box-shadow:inset 0 1px #ffffff22;padding:4px}
.monochrome .app:not(:hover) img{filter:grayscale(1) drop-shadow(0 2px 2px #0004)}
.app:hover .icon,.app:focus-visible .icon{opacity:1;transform:scale(var(--zoom))}
.app.launching .icon{animation:bounce .5s ease 2}
.app.dragging{opacity:.35}.app.drop-target{outline:2px solid #dcd9d1}
.indicator{display:none;position:absolute;bottom:-1px;width:4px;height:4px;border-radius:4px;background:var(--indicator);pointer-events:none}
.app.running .indicator{display:block}.app.active .indicator{box-shadow:0 0 5px var(--indicator)}
.line .indicator{width:14px;height:3px}.none .indicator{display:none!important}
.left .indicator{bottom:auto;left:-4px}.right .indicator{bottom:auto;right:-4px}
.left.line .indicator,.right.line .indicator{width:3px;height:14px}
.studio{width:calc(var(--icon)*.65);color:#e6e3dd;opacity:.65}.studio:hover{opacity:1;background:#ffffff12}.studio svg{width:20px;height:20px}
.divider{width:1px;height:calc(var(--icon)*.65);background:#ffffff26;flex-shrink:0;margin:0 3px}
.left .divider,.right .divider{width:calc(var(--icon)*.65);height:1px;margin:3px 0}
.clock{font-size:11px;font-variant-numeric:tabular-nums;padding:0 2px;white-space:nowrap}
#label,#error{position:fixed;z-index:10;pointer-events:none;padding:6px 10px;border:1px solid #ffffff20;border-radius:7px;background:#24252dec;color:#f5f3ee;box-shadow:0 4px 12px #0003;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#label[hidden],#error[hidden],#menu[hidden]{display:none}#error{left:12px;right:12px;top:4px;font-size:11px}
#menu{position:fixed;z-index:20;inset:6px;overflow:auto;padding:5px;border:1px solid #ffffff22;border-radius:10px;background:#22242ff5;box-shadow:0 6px 16px #0006}
#menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:5px;white-space:nowrap}
#menu button:hover{background:#ffffff12}#menu .name{font-size:11px;color:#aaa;padding:5px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.collapsed{padding:0}.collapsed .dock{visibility:hidden}body.collapsed::after{content:'';position:fixed;inset:0;background:rgba(var(--tint),.25);border-radius:5px}
@keyframes bounce{0%,100%{translate:0 0}50%{translate:0 -8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body class="bottom"><div id="dock" class="dock"><div id="apps" class="apps" aria-label="Applications"></div><span class="divider"></span><time id="clock" class="clock" hidden></time><button id="studio" class="studio" title="Open Atelier" aria-label="Open Atelier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m7 17 5-10 5 10m-8-3h6"/></svg></button></div><div id="label" hidden></div><div id="error" role="status" hidden></div><div id="menu" role="menu" hidden></div><script src="dock.js"></script></body></html>
