[package]
name = "atelier-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Central native background daemon, Win32 event pump, and subsystem orchestrator for Atelier."

[lib]
name = "atelier_core"
path = "src/lib.rs"

[[bin]]
name = "atelier-core"
path = "src/main.rs"

[dependencies]
atelier-common.workspace = true
atelier-taskbar.workspace = true
atelier-wallpaper.workspace = true
atelier-audio.workspace = true
atelier-widget.workspace = true

mimalloc.workspace = true
tokio.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
