[package]
name = "atelier-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Theme Studio management UI and live desktop preview controls for Atelier."

[lib]
name = "atelier_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Atelier"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
atelier-common.workspace = true
atelier-taskbar.workspace = true
atelier-wallpaper.workspace = true
atelier-audio.workspace = true
atelier-widget.workspace = true
atelier-core = { path = "../atelier-core" }
mimalloc.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
windows.workspace = true
crossbeam-channel.workspace = true
