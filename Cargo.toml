[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/core",
    "crates/taskbar",
    "crates/wallpaper",
    "crates/audio",
    "crates/widget",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
atelier-common = { path = "crates/common" }
atelier-taskbar = { path = "crates/taskbar" }
atelier-wallpaper = { path = "crates/wallpaper" }
atelier-audio = { path = "crates/audio" }
atelier-widget = { path = "crates/widget" }

mimalloc = { version = "0.1", default-features = false }
windows = { version = "0.58" }

tokio = { version = "1.40", features = ["full"] }
crossbeam-channel = "0.5"

thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
