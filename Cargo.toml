[workspace]
resolver = "2"
members = [
    "crates/atelier-common",
    "crates/atelier-core",
    "crates/atelier-taskbar",
    "crates/atelier-wallpaper",
    "crates/atelier-audio",
    "crates/atelier-widget",
    "crates/atelier-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
atelier-common = { path = "crates/atelier-common" }
atelier-taskbar = { path = "crates/atelier-taskbar" }
atelier-wallpaper = { path = "crates/atelier-wallpaper" }
atelier-audio = { path = "crates/atelier-audio" }
atelier-widget = { path = "crates/atelier-widget" }

mimalloc = { version = "0.1", default-features = false }
windows = { version = "0.58" }

tokio = { version = "1.40", features = ["full"] }
crossbeam-channel = "0.5"

thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
